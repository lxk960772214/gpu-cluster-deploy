cluster:
  name: "gpu-test-cluster"
  deploy_user: "ubuntu"

jumphost:
  host: "10.0.16.211"
  port: 22
  auth:
    type: "key"
    username: "ubuntu"
    # password: "5lCyFK8.wupsdrSv"
    private_key: "~/.ssh/id_rsa"
    # node_auth:
    #   type: "key"
    #   username: "root"
    #   password: "taL1eqvYiv.fmI7o"

nodes:
  - hostname: "gpugpugpu2"
    ip: "10.0.16.211"
    username: "ubuntu"
    # password: "5lCyFK8.wupsdrSv"
    private_key: "~/.ssh/id_rsa"  # 或使用密钥
    roles:
      - nfs_server
      - time_server
      - gpu_node
      - test_compile      # 此节点负责编译测试工具（role_based策略）
    storage:
      type: "single"
      device: "/dev/vdb"
      mount_point: "/ssd"
      filesystem: "ext4"
      format_disk: true

  # - hostname: "gpugpugpu1"
  #   ip: "10.0.22.143"
  #   username: "ubuntu"
  #   # password: "v5GhFfO.y7Q6SQyI"
  #   private_key: "~/.ssh/id_rsa"  # 或使用密钥
  #   roles:
  #     - gpu_node          # 只运行测试，不参与编译
  #   storage:
  #     type: "single"
  #     device: "/dev/vdb"
  #     mount_point: "/ssd"
  #     filesystem: "ext4"
  #     format_disk: true

nfs:
  enabled: true
  server: "gpugpugpu2"
  export_path: "/ssd/nfs"
  client_mount: "/ssd/nfs"

time_sync:
  server: "gpugpugpu2"
  timezone: "Asia/Shanghai"

ssh_key:
  enabled: true
  users:
    - ubuntu
    - root